# Fendrisk Security Preflight — static single-file product. No build step.
[build]
  publish = "."
  command = ""

[build.processing]
  skip_processing = true

[[redirects]]
  from = "/index.htm"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/preflight"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
